[project]
name = "engram-mcp"
version = "0.1.0"
description = "Engram — local, private semantic code-index MCP server (local embeddings + LanceDB)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "filelock>=3.29.4",
    "lancedb>=0.33.0",
    "mcp[cli]>=1.28.0",
    "pathspec>=1.1.1",
    "truststore>=0.10",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
# Quality embedders (Qwen3-Embedding) + cross-encoder reranker run on torch.
# Heavy (~2GB) + GPU-recommended, so opt-in: `uv sync --extra gpu`.
gpu = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2",
]

[project.scripts]
engram = "engram_mcp.cli:main"
engram-mcp = "engram_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# GPU torch for the optional `gpu` extra. This only affects resolution when
# torch is pulled in (i.e. `uv sync --extra gpu`) — the default `uv sync`
# (bge / FastEmbed, no torch) is untouched. Scoped to win/linux; macOS falls
# back to the default torch wheel (no CUDA wheels there anyway).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
